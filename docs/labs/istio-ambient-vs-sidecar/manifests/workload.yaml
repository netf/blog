# Rendered once per namespace by scripts/02-workloads.sh (NAMESPACE is replaced).
# The client is a fortio server too, so it stays up and `kubectl exec ... fortio load`
# can be run inside it. Client and server are pinned to different workers.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: server
  namespace: NAMESPACE
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: client
  namespace: NAMESPACE
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: NAMESPACE
spec:
  selector:
    app: server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
        version: v1
    spec:
      serviceAccountName: server
      nodeSelector:
        lab/role: server
      containers:
        - name: fortio
          image: fortio/fortio:1.76.0
          imagePullPolicy: IfNotPresent
          args: ["server"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      serviceAccountName: client
      nodeSelector:
        lab/role: client
      containers:
        - name: fortio
          image: fortio/fortio:1.76.0
          imagePullPolicy: IfNotPresent
          args: ["server"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
