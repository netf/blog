# Spark 4.1.4 + iceberg-spark-runtime-4.1_2.13:1.12.0 + iceberg-aws-bundle:1.12.0
# One principal per engine (or per job), granted only the tables kit/grants.py found in the audit log.
spark.sql.extensions                                   org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                            rest
spark.sql.catalog.lake.uri                             http://polaris:8181/api/catalog
spark.sql.catalog.lake.warehouse                       lake_c
spark.sql.catalog.lake.credential                      <client_id>:<client_secret>
spark.sql.catalog.lake.scope                           PRINCIPAL_ROLE:ALL
spark.sql.catalog.lake.header.X-Iceberg-Access-Delegation  vended-credentials
# Default is already true in Iceberg 1.12.0; pinned so an upgrade that flips it fails the canary, not prod.
spark.sql.catalog.lake.client.refresh-credentials-enabled  true
# No s3.access-key-id / s3.secret-access-key here: the catalog vends them per table.
