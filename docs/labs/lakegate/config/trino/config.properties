coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
# long sleeping UDF jobs from several arms run at once; the default (2 x cores) would queue them
task.max-worker-threads=64
query.max-execution-time=4h
query.client.timeout=4h
# one driver per task: each job query then reads its source files one at a time, in order
task.max-drivers-per-task=1
task.min-drivers-per-task=1
